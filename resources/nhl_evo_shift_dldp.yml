resources:
  pipelines:
    nhl_evo_shift_dldp:
      name: NHL_EVO_Shift_DLDP
      configuration:
        bronze_catalog: nhl_evo_raw
        silver_catalog: nhl_evo_staged
        bronze_py_source: NHL_API_Shift_S3_Raw
        silver_py_source: NHL_API_Shift_S3_Staged
        api_schema: games
        s3_ext_vol: "/Volumes/nhl_evo_s3/games/shift_data"
        pipelines.dropInactiveTables: "true"
      libraries:
        - glob:
            include: /Workspace/Users/${workspace.current_user.userName}/NHL_EVO/NHL_EVO_Shifts/shift_data_raw/**
        - glob:
            include: /Workspace/Users/${workspace.current_user.userName}/NHL_EVO/NHL_EVO_Shifts/shift_data_staged/**
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: nhl_evo_raw
      schema: games
      serverless: true
      root_path: /Workspace/Users/${workspace.current_user.userName}/NHL_EVO/NHL_EVO_Shifts
