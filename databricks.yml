# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "NHL_EVO_Live_Game_Data"

include:
  - resources/*.yml
  - resources/*/*.yml


targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    presets: 
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-93e72fa0-2c4b.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-93e72fa0-2c4b.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}
