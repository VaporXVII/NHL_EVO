resources:
  jobs:
    nhl_evo_shift:
      name: NHL_EVO_Shift_Job
      email_notifications:
        on_success:
          - ${workspace.current_user.userName}
        on_failure:
          - ${workspace.current_user.userName}
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/nhl_evo_s3/games/shift_data/
          wait_after_last_change_seconds: 90
          min_time_between_triggers_seconds: 900
      tasks:
        - task_key: NHL_EVO_Shift_DLDP
          pipeline_task:
            pipeline_id: ${resources.pipelines.nhl_evo_shift_dldp.id}
            full_refresh: false
          max_retries: 1
          min_retry_interval_millis: 30000
          retry_on_timeout: true
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
